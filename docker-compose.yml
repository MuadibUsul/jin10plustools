# PLUS 日报服务端一键部署：docker compose up -d
# 首次部署前：复制 .env.example 为 .env 并填写密码与密钥
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-plus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: jin10-server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PLUS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-plus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-plus}
      PLUS_JWT_SECRET: ${PLUS_JWT_SECRET:?请在 .env 中设置 PLUS_JWT_SECRET}
      PLUS_JEV_API_KEY: ${PLUS_JEV_API_KEY:-}
      PLUS_BRIEFS_GPU_EDITORIAL_MODE: ${PLUS_BRIEFS_GPU_EDITORIAL_MODE:-shadow}
      PLUS_BRIEFS_EDITORIAL_MODE: ${PLUS_BRIEFS_EDITORIAL_MODE:-shadow}
      NEWS_SKILL_OS_ENABLED: ${NEWS_SKILL_OS_ENABLED:-false}
    volumes:
      - storage:/data
    ports:
      - "${PLUS_API_PORT:-8000}:8000"

  brief-worker:
    build:
      context: .
      dockerfile: jin10-server/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.briefs.worker"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      PLUS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-plus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-plus}
      PLUS_JWT_SECRET: ${PLUS_JWT_SECRET:?请在 .env 中设置 PLUS_JWT_SECRET}
      PLUS_BRIEFS_DEEPSEEK_API_KEY: ${PLUS_BRIEFS_DEEPSEEK_API_KEY:-}
      PLUS_BRIEFS_DEEPSEEK_MODEL: ${PLUS_BRIEFS_DEEPSEEK_MODEL:-}
      PLUS_BRIEFS_GPU_EDITORIAL_MODE: ${PLUS_BRIEFS_GPU_EDITORIAL_MODE:-shadow}
      PLUS_BRIEFS_EDITORIAL_MODE: ${PLUS_BRIEFS_EDITORIAL_MODE:-shadow}
    volumes:
      - storage:/data
    mem_limit: 1g
    cpus: 1.0

volumes:
  pgdata:
  storage:
