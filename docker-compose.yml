# PLUS 日报服务端一键部署：docker compose up -d
# 首次部署前：复制 .env.example 为 .env 并填写密码与密钥
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-plus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./jin10-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PLUS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-plus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-plus}
      PLUS_JWT_SECRET: ${PLUS_JWT_SECRET:?请在 .env 中设置 PLUS_JWT_SECRET}
      PLUS_JEV_API_KEY: ${PLUS_JEV_API_KEY:-}
    volumes:
      - storage:/data
    ports:
      - "${PLUS_API_PORT:-8000}:8000"

volumes:
  pgdata:
  storage:
