<div class="annotation-content"><div class="a2ui-preview is-app-style"><header class="a2ui-preview-header"><div class="a2ui-preview-header__content">英债供需结构变了</div></header><div class="a2ui-preview-module"><div class="a2ui-module-shell has-footer" role="button" tabindex="0"><section class="a2ui-card"><h3 class="a2ui-section-title">重点观察</h3><div class="a2ui-observation__items"><div class="a2ui-observation__row"><span class="a2ui-observation__badge is-blue">01</span><p class="a2ui-observation__text">过去英国固定收益养老金是超长英债的核心买家，但随着养老金体系转型和2022年英债危机后风控调整，加上英国央行持续卖出国债，本土稳定长线资金减少，长债天然买盘萎缩。</p></div><div class="a2ui-observation__row"><span class="a2ui-observation__badge is-blue">02</span><p class="a2ui-observation__text">美国、欧洲多国大规模发债，全球主权债供给扎堆，英国要和全球各国竞争资金，投资者要求更高期限溢价。</p></div><div class="a2ui-observation__row"><span class="a2ui-observation__badge is-blue">03</span><p class="a2ui-observation__text">英国通胀挂钩债（指数联动国债）占比偏高，通胀高企时利息支出会被动上涨；市场现在对财政赤字、债务路径容错率很低，一点点财政宽松预期就会推高收益率。</p></div></div></section><div class="a2ui-module-footer"><div class="a2ui-module-footer__images"><img src="https://img.jin10.com/misc/26/09/Qth2R_ghf4ISbSp7WS-ja.jpg/lite" alt="" class="is-previewable"></div></div></div></div><p class="a2ui-preview-disclaimer"> 本解读由金十数据PLUS团队人工编辑，仅供参考，不构成投资建议 </p></div></div>
