api_version: news.skill/v1
id: news.event-extraction
version: 0.1.0
owner: plus-editorial
description: Extract only explicitly annotated assertions from an offline fixture.
entrypoint: app.news_skill_os.skills.extraction:run
input_schema:
  type: object
  additionalProperties: false
  required: [article]
  properties:
    article: {type: object}
output_schema:
  type: object
  additionalProperties: false
  required: [event, sources, claims, evidence]
  properties:
    event: {type: object}
    sources: {type: array}
    claims: {type: array}
    evidence: {type: array}
model_profile: deterministic-fixture
timeouts: {seconds: 10}
retry_policy: {max_attempts: 1}
idempotency: deterministic
allowed_tools: [local_fixture]
permissions: {network: false, database_read: false, database_write: false, publish: false}
quality_gates: [no-unannotated-claims]
evaluation_suite: tests/test_news_skill_os_workflow.py
