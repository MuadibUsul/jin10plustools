api_version: news.skill/v1
id: news.fact-verification
version: 0.1.0
owner: plus-editorial
description: Check cited evidence, number consistency and independent source roots.
entrypoint: app.news_skill_os.skills.verification:run
input_schema:
  type: object
  additionalProperties: false
  required: [extraction]
  properties:
    extraction: {type: object}
output_schema:
  type: object
  additionalProperties: false
  required: [claims, evidence, verified_claim_ids, warnings]
  properties:
    claims: {type: array}
    evidence: {type: array}
    verified_claim_ids: {type: array}
    warnings: {type: array}
model_profile: deterministic-fixture
timeouts: {seconds: 10}
retry_policy: {max_attempts: 1}
idempotency: deterministic
allowed_tools: [local_fixture]
permissions: {network: false, database_read: false, database_write: false, publish: false}
quality_gates: [number-consistency, source-independence]
evaluation_suite: tests/test_news_skill_os_workflow.py
dependencies: [news.event-extraction@0.1.0]
