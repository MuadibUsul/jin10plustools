api_version: news.skill/v1
id: news.quality-review
version: 0.1.0
owner: plus-editorial
description: Block drafts without verified claims or evidence-traceable analysis.
entrypoint: app.news_skill_os.skills.review:run
input_schema:
  type: object
  additionalProperties: false
  required: [verification, analysis]
  properties:
    verification: {type: object}
    analysis: {type: object}
output_schema:
  type: object
  additionalProperties: false
  required: [approved, issues, trace]
  properties:
    approved: {type: boolean}
    issues: {type: array}
    trace: {type: object}
model_profile: deterministic-fixture
timeouts: {seconds: 10}
retry_policy: {max_attempts: 1}
idempotency: deterministic
allowed_tools: [local_fixture]
permissions: {network: false, database_read: false, database_write: false, publish: false}
quality_gates: [manual-approval-required]
evaluation_suite: tests/test_news_skill_os_workflow.py
dependencies: [finance.causal-analysis@0.1.0]
