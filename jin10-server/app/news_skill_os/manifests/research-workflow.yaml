api_version: news.workflow/v1
id: news.research-draft
input_schema:
  type: object
  additionalProperties: false
  required: [article, background_fixture]
  properties:
    article: {type: object}
    background_fixture: {type: object}
nodes:
  - id: extraction
    skill_id: news.event-extraction
    skill_version: 0.1.0
    bindings: {article: "$input.article"}
  - id: verification
    skill_id: news.fact-verification
    skill_version: 0.1.0
    depends_on: [extraction]
    bindings: {extraction: "$node.extraction"}
  - id: background
    skill_id: news.background-research
    skill_version: 0.1.0
    depends_on: [verification]
    bindings: {verification: "$node.verification", background_fixture: "$input.background_fixture"}
  - id: analysis
    skill_id: finance.causal-analysis
    skill_version: 0.1.0
    depends_on: [verification, background]
    bindings: {verification: "$node.verification", background: "$node.background"}
  - id: review
    skill_id: news.quality-review
    skill_version: 0.1.0
    depends_on: [verification, analysis]
    bindings: {verification: "$node.verification", analysis: "$node.analysis"}
    review_gate: true
