<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>固定快讯 · PLUS 工作台</title><link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/retro-terminal.css"><link rel="stylesheet" href="/pull-cord.css"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"></head><body>
<header><a class="brand" href="/"><span>PLUS</span>工作台</a><nav><a href="/daily/">日报选稿</a><a class="active" href="/briefs/">固定快讯</a><a href="/fresh/">Plus新鲜事</a><a href="/annotations/">Plus注解辅助</a></nav><div id="account"></div></header>
<main><div class="page-heading"><div><p class="eyebrow">FIXED BRIEFS</p><h1>固定快讯</h1><p class="muted">自动生产，逐项核对，确认后取稿。</p></div><div class="toolbar"><label>生产日期 <input type="date" id="day"></label><button id="refresh">刷新</button></div></div>
<p id="message" role="status"></p><div id="brief-workspace" class="brief-workspace"><section id="cards" class="brief-grid"></section></div>

<footer class="brief-footer">自动任务：工作日08:00—10:00（北京时间），到点停止重试；手动生成不限时，并自动刷新来源、采用最接近当前的可用数据。数据日取前一工作日，流动性取当天；AI算力栏目若当天未更新，会使用已导入的最新数据并在稿内标注实际数据日。</footer>
</main><dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"><section id="detail" class="detail"><div class="detail-head"><div><h2 id="detail-title"></h2><p id="detail-status" class="muted"></p></div><button id="close-detail">关闭</button></div>
<div class="editor-grid"><div><label class="field">版本<select id="version" aria-label="稿件版本"></select></label>
<label class="field">标题<input id="title" maxlength="300"></label><label class="field">动态正文<textarea id="body" rows="9"></textarea></label>
<details open><summary id="notes-label">注释</summary><label class="field">本期注释<textarea id="fixed" rows="8" maxlength="2000"></textarea></label><a class="muted" href="/settings/">栏目默认注释在设置中管理 →</a></details>
<div id="warnings" class="warnings"></div>
<div class="toolbar"><button id="save" class="primary">保存修改</button><button id="confirm">确认此版本</button><button id="unconfirm">撤回确认</button></div>
<div class="toolbar"><button id="copy-title">复制标题</button><button id="copy-body">复制完整正文</button></div>
</div><div><div id="images" class="images"></div><details><summary>数据核对与来源</summary><pre id="facts"></pre></details><div class="toolbar"><button id="rerender">重新制图</button><button id="refetch">重新取数</button></div></div></div></section></dialog><script type="module" src="/briefs.js"></script></body></html>
