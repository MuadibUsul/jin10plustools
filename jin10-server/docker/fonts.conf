<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  模板字体 → 镜像内开源字体（PDF 导出用）。
  思源黑体 / 思源宋体 与 Noto Sans CJK / Noto Serif CJK 为同一套设计（Adobe 与 Google 联合发布，SIL OFL），
  字形与字宽一致，因此排版测算结果同样适用。模板中的字体名带字重后缀，这里逐一映射到对应字重。
-->
<fontconfig>
  <match target="pattern"><test name="family"><string>思源黑体 CN Bold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit></match>
  <match target="pattern"><test name="family"><string>思源黑体 CN Normal</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
    <edit name="weight" mode="assign"><const>regular</const></edit></match>
  <match target="pattern"><test name="family"><string>思源黑体 CN Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
    <edit name="weight" mode="assign"><const>light</const></edit></match>
  <match target="pattern"><test name="family"><string>思源宋体 CN Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
    <edit name="weight" mode="assign"><const>light</const></edit></match>
  <match target="pattern"><test name="family"><string>思源宋体 CN Heavy</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
    <edit name="weight" mode="assign"><const>black</const></edit></match>
  <!-- 模板中少量装饰文字使用的商用字体，以同风格开源字体替代 -->
  <match target="pattern"><test name="family"><string>锐字云字库综艺GB</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
    <edit name="weight" mode="assign"><const>black</const></edit></match>
  <match target="pattern"><test name="family"><string>宋体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
</fontconfig>
