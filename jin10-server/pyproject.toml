[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jin10-plus-server"
version = "0.1.0"
description = "PLUS 日报服务端：团队素材库、AI 分析、PPT 生成"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "python-pptx>=1.0",
  "lxml>=5",
  "pillow>=10",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "matplotlib>=3.9,<4",
  # NumPy 2.4+ wheels require x86-64-v2, unavailable on the shared VPS.
  "numpy>=2,<2.4",
  "playwright==1.58.0",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.briefs" = ["seed/*.json", "assets/*", "engines/*/assets/*", "samples/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
